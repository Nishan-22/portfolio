services:
  - type: web
    name: portfolio
    env: python
    plan: free

    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      # Database (set manually in dashboard OR connect PostgreSQL)
      - key: DATABASE_URL
        sync: false

      - key: ALLOWED_HOSTS
        value: "*"

      # Email config
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

      # Cloudinary config
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Admin user (IMPORTANT)
      - key: ADMIN_USERNAME
        value: admin

      - key: ADMIN_EMAIL
        value: admin@example.com   # REQUIRED

      - key: ADMIN_PASSWORD
        generateValue: true